name: currency-exchange

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quotes
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quotes"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:postgres@postgres:5432/quotes?sslmode=disable"
      - "up"
    restart: "no"

  fakeprovider:
    build:
      context: .
      target: fakeprovider
    environment:
      FAKE_ADDR: ":9090"
      FAKE_SEED: "42"
      FAKE_MONTHLY_QUOTA: "100000"
      FAKE_LATENCY_MIN_MS: "${FAKE_LATENCY_MIN_MS:-0}"
      FAKE_LATENCY_MAX_MS: "${FAKE_LATENCY_MAX_MS:-0}"

  server:
    build:
      context: .
      target: server
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      fakeprovider:
        condition: service_started
    environment:
      HTTP_ADDR: ":8080"
      DB_DSN: postgres://postgres:postgres@postgres:5432/quotes?sslmode=disable
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-http://fakeprovider:9090}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-dev-key}
      APP_ENV: development
      LOG_LEVEL: info
      WHITELIST_CURRENCIES: USD,EUR,MXN
      SCHEDULER_TICK_SECONDS: "30"
      COALESCING_WINDOW_SECONDS: "30"
      WORKER_COUNT: "1"
      REFRESH_MAX_LATENCY_MS: "2000"
    ports: ["8080:8080"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:11.3.2
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  k6:
    image: grafana/k6:0.55.0
    profiles: ["loadtest"]
    depends_on:
      - server
      - prometheus
      - grafana
    volumes:
      - ./loadtest:/scripts:ro
    networks:
      - default

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
